name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  unsigned-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-install.log
      - name: Install pinned Android SDK components
        run: bash scripts/ci-android-sdk.sh 2>&1 | tee /tmp/android-setup.log
      - name: Test local simulator and TypeScript
        run: |
          npm run test:mobile 2>&1 | tee /tmp/mobile-tests.log
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Build unsigned ARM64 release
        working-directory: apps/mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableBundleCompression=true -Pexpo.useLegacyPackaging=true \
            '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m' \
            --max-workers=2 --console=plain 2>&1 | tee /tmp/android-build.log
      - name: Publish unsigned build for private local signing
        # No private signing material is stored or generated on the runner.
        # This output branch never triggers this workflow or the production site.
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          export APK_SHA256="$(sha256sum "$apk" | cut -d ' ' -f1)"
          node -e 'require("fs").writeFileSync("/tmp/build-info.json",JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,sha256:process.env.APK_SHA256,architecture:"arm64-v8a",signed:false}))'
          git config user.name 'NEXUS Android Build'
          git config user.email 'android-build@users.noreply.github.com'
          apk_blob=$(git hash-object -w "$apk")
          info_blob=$(git hash-object -w /tmp/build-info.json)
          tree=$(printf '100644 blob %s\tbuild-info.json\n100644 blob %s\tnexus-home-1.0.0-arm64-unsigned.apk\n' "$info_blob" "$apk_blob" | git mktree)
          parent_args=()
          if git ls-remote --exit-code --heads origin android-apk-output >/dev/null; then
            git fetch origin android-apk-output
            parent_args=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          commit=$(printf 'Unsigned Android build for %s\n' "$SOURCE_COMMIT" | git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit":refs/heads/android-apk-output
      - name: Publish build diagnostic status
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cat /tmp/npm-install.log /tmp/android-setup.log /tmp/mobile-tests.log /tmp/typecheck.log /tmp/android-build.log > /tmp/combined-build.log 2>/dev/null || true
          node -e 'require("fs").writeFileSync("/tmp/build-status.json",JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,status:process.env.BUILD_STATUS}))'
          git config user.name 'NEXUS Android Build'
          git config user.email 'android-build@users.noreply.github.com'
          log_blob=$(git hash-object -w /tmp/combined-build.log)
          info_blob=$(git hash-object -w /tmp/build-status.json)
          tree=$(printf '100644 blob %s\tbuild-status.json\n100644 blob %s\tbuild.log\n' "$info_blob" "$log_blob" | git mktree)
          parent_args=()
          if git ls-remote --exit-code --heads origin android-apk-status >/dev/null; then
            git fetch origin android-apk-status
            parent_args=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          commit=$(printf 'Android build status for %s\n' "$SOURCE_COMMIT" | git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit":refs/heads/android-apk-status
