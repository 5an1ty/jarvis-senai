# Import the repository in Netlify and select branch main.
# Keep the base directory at the repository root for npm workspaces.
[build]
  base = "."
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js routing, assets and server output are handled by the Netlify runtime.
# Do not add a catch-all rewrite to index.html.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the signed Android release as a downloadable installer.
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000, immutable"
